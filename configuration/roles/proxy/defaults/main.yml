---
haproxy_http_port: 80
haproxy_https_port: 443

# Public reverse proxy: only customer-facing services.
# gitlab + vault stay internal (reachable via the bastion), not exposed here.
# kanban-app backend will be added in Phase 6.
haproxy_backends:
  - name: keycloak
    host: "vm-keycloak.{{ domain }}"
    ip: "{{ hostvars['vm-keycloak']['ansible_host'] }}"
    port: 8443
