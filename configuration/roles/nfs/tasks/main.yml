---
- name: Install NFS server
  apt:
    name:
      - nfs-kernel-server
    state: present
    update_cache: true
  become: true

- name: Create export directory
  file:
    path: "{{ nfs_export_path }}"
    state: directory
    owner: root
    group: root
    mode: "0777"
  become: true

- name: Deploy /etc/exports
  template:
    src: exports.j2
    dest: /etc/exports
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Reload exports

- name: Enable and start NFS server
  service:
    name: nfs-kernel-server
    state: started
    enabled: true
  become: true

- name: Allow NFS in UFW
  ufw:
    rule: allow
    port: "2049"
    proto: tcp
    src: "{{ subnet_kubernetes }}"
  become: true

- name: Allow rpcbind in UFW
  ufw:
    rule: allow
    port: "111"
    proto: tcp
    src: "{{ subnet_kubernetes }}"
  become: true
