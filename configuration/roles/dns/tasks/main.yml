---
- name: Install bind9
  apt:
    name:
      - bind9
      - bind9utils
    state: present
    update_cache: true
  become: true

- name: Deploy named.conf.options
  template:
    src: named.conf.options.j2
    dest: /etc/bind/named.conf.options
    owner: root
    group: bind
    mode: "0644"
    validate: /usr/bin/named-checkconf %s
  become: true
  notify: Restart named

- name: Deploy named.conf.local
  template:
    src: named.conf.local.j2
    dest: /etc/bind/named.conf.local
    owner: root
    group: bind
    mode: "0644"
    validate: /usr/bin/named-checkconf %s
  become: true
  notify: Restart named

- name: Deploy zone file
  template:
    src: db.homelab.local.j2
    dest: "/etc/bind/db.{{ dns_zone }}"
    owner: root
    group: bind
    mode: "0644"
  become: true
  notify: Restart named

- name: Validate zone file
  command: >
    named-checkzone {{ dns_zone }}
    /etc/bind/db.{{ dns_zone }}
  become: true
  changed_when: false

- name: Enable and start named
  service:
    name: named
    state: started
    enabled: true
  become: true

- name: Allow DNS UDP in UFW
  ufw:
    rule: allow
    port: "53"
    proto: udp
  become: true

- name: Allow DNS TCP in UFW
  ufw:
    rule: allow
    port: "53"
    proto: tcp
  become: true
