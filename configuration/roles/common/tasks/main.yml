---
- name: Update apt cache
  apt:
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: Install base packages
  apt:
    name:
      - curl
      - git
      - vim
      - htop
      - python3
      - python3-pip
      - unzip
      - jq
    state: present
  become: true

- name: Set timezone
  timezone:
    name: "{{ timezone }}"
  become: true

- name: Configure NTP
  copy:
    dest: /etc/systemd/timesyncd.conf
    content: |
      [Time]
      NTP=pool.ntp.org
  become: true
  notify: Restart timesyncd

- name: Create /opt/homelab directory
  file:
    path: /opt/homelab
    state: directory
    owner: ansible
    group: ansible
    mode: "0755"
  become: true
