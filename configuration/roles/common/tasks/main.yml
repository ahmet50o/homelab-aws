---
- name: Update apt cache
  apt:
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: Install base packages
  apt:
    name:
      - curl
      - git
      - vim
      - htop
      - python3
      - python3-pip
      - unzip
      - jq
    state: present
  become: true

- name: Set timezone
  timezone:
    name: "{{ timezone }}"
  become: true

- name: Configure NTP
  copy:
    dest: /etc/systemd/timesyncd.conf
    content: |
      [Time]
      NTP=pool.ntp.org
  become: true
  notify: Restart timesyncd

- name: Create /opt/homelab directory
  file:
    path: /opt/homelab
    state: directory
    owner: ansible
    group: ansible
    mode: "0755"
  become: true

- name: Download step CLI
  get_url:
    url: "https://github.com/smallstep/cli/releases/download/v{{ step_cli_version }}/step_linux_amd64.tar.gz"
    dest: /tmp/step-cli.tar.gz
    mode: "0644"
  become: true

- name: Extract step CLI
  unarchive:
    src: /tmp/step-cli.tar.gz
    dest: /tmp/
    remote_src: true
  become: true

- name: Install step CLI
  copy:
    src: /tmp/step_linux_amd64/bin/step
    dest: /usr/local/bin/step
    mode: "0755"
    remote_src: true
  become: true

- name: Clean up step CLI archive
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /tmp/step-cli.tar.gz
    - /tmp/step_linux_amd64
  become: true
