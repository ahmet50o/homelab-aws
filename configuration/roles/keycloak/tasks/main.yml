---
- name: Install Java 21
  apt:
    name: openjdk-21-jre-headless
    state: present
    update_cache: true
  become: true

- name: Create keycloak group
  group:
    name: keycloak
    system: true
  become: true

- name: Create keycloak user
  user:
    name: keycloak
    group: keycloak
    system: true
    shell: /usr/sbin/nologin
    home: "{{ keycloak_dir }}"
    create_home: false
  become: true

- name: Download Keycloak
  get_url:
    url: "https://github.com/keycloak/keycloak/releases/download/{{ keycloak_version }}/keycloak-{{ keycloak_version }}.tar.gz"
    dest: /tmp/keycloak.tar.gz
    mode: "0644"
  become: true

- name: Extract Keycloak
  unarchive:
    src: /tmp/keycloak.tar.gz
    dest: /opt/
    remote_src: true
  become: true

- name: Rename keycloak directory
  command: mv /opt/keycloak-{{ keycloak_version }} {{ keycloak_dir }}
  args:
    creates: "{{ keycloak_dir }}"
  become: true

- name: Create TLS directory
  file:
    path: "{{ keycloak_dir_tls }}"
    state: directory
    owner: keycloak
    group: keycloak
    mode: "0750"
  become: true

- name: Set keycloak directory ownership
  file:
    path: "{{ keycloak_dir }}"
    state: directory
    owner: keycloak
    group: keycloak
    recurse: true
  become: true

- name: Request TLS certificate from step-ca
  command: >
    step ca certificate {{ keycloak_hostname }}
    {{ keycloak_dir_tls }}/keycloak.crt
    {{ keycloak_dir_tls }}/keycloak.key
    --ca-url {{ step_ca_url }}
    --root /usr/local/share/ca-certificates/homelab-root-ca.crt
    --provisioner {{ step_ca_provisioner }}
    --provisioner-password-file {{ step_ca_dir }}/password.txt
    --not-after 2160h
    --force
  args:
    creates: "{{ keycloak_dir_tls }}/keycloak.crt"
  become: true

- name: Set TLS cert ownership
  file:
    path: "{{ item }}"
    owner: keycloak
    group: keycloak
    mode: "0640"
  loop:
    - "{{ keycloak_dir_tls }}/keycloak.crt"
    - "{{ keycloak_dir_tls }}/keycloak.key"
  become: true

- name: Deploy keycloak.conf
  template:
    src: keycloak.conf.j2
    dest: "{{ keycloak_dir_conf }}/keycloak.conf"
    owner: keycloak
    group: keycloak
    mode: "0640"
  become: true
  notify: Restart keycloak

- name: Deploy systemd service
  template:
    src: keycloak.service.j2
    dest: /etc/systemd/system/keycloak.service
    mode: "0644"
  become: true
  notify:
    - Reload systemd
    - Restart keycloak

- name: Enable and start keycloak
  service:
    name: keycloak
    state: started
    enabled: true
  become: true

- name: Wait for keycloak to be ready
  wait_for:
    port: "{{ keycloak_port }}"
    host: 127.0.0.1
    delay: 10
    timeout: 120
  become: true

- name: Configure kcadm credentials
  command: >
    {{ keycloak_dir }}/bin/kcadm.sh config credentials
    --server https://127.0.0.1:{{ keycloak_port }}
    --realm master
    --user {{ keycloak_admin_user }}
    --password {{ keycloak_admin_password }}
  become: true
  become_user: keycloak
  no_log: true
  changed_when: false

- name: Create realms
  command: >
    {{ keycloak_dir }}/bin/kcadm.sh create realms
    -s realm={{ item.name }}
    -s enabled=true
    -s displayName="{{ item.display_name }}"
  loop: "{{ keycloak_realms }}"
  become: true
  become_user: keycloak
  register: realm_result
  failed_when:
    - realm_result.rc != 0
    - "'already exists' not in realm_result.stderr"
  changed_when: realm_result.rc == 0

- name: Create clients
  command: >
    {{ keycloak_dir }}/bin/kcadm.sh create clients
    -r {{ item.realm }}
    -s clientId={{ item.client_id }}
    -s enabled=true
    -s publicClient=false
    -s secret={{ item.secret }}
    -s 'redirectUris={{ item.redirect_uris | to_json }}'
  loop: "{{ keycloak_clients }}"
  become: true
  become_user: keycloak
  register: client_result
  failed_when:
    - client_result.rc != 0
    - "'already exists' not in client_result.stderr"
  changed_when: client_result.rc == 0
  no_log: true

- name: Create realm roles
  command: >
    {{ keycloak_dir }}/bin/kcadm.sh create roles
    -r {{ item.realm }}
    -s name={{ item.name }}
  loop: "{{ keycloak_roles }}"
  become: true
  become_user: keycloak
  register: role_result
  failed_when:
    - role_result.rc != 0
    - "'already exists' not in role_result.stderr"
  changed_when: role_result.rc == 0

- name: Allow keycloak port in UFW
  ufw:
    rule: allow
    port: "{{ keycloak_port | string }}"
    proto: tcp
    src: "192.168.0.0/16"
  become: true
