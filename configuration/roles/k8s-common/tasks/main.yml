
- name: Install containerd
  apt:
    name: containerd
    state: present
    update_cache: true
  become: true

- name: Create containerd config directory
  file:
    path: /etc/containerd
    state: directory
    mode: "0755"
  become: true

- name: Generate default containerd config
  shell: containerd config default > /etc/containerd/config.toml
  args:
    creates: /etc/containerd/config.toml
  become: true
  notify: Restart containerd

- name: Enable SystemdCgroup in containerd
  replace:
    path: /etc/containerd/config.toml
    regexp: 'SystemdCgroup = false'
    replace: 'SystemdCgroup = true'
  become: true
  notify: Restart containerd

- name: Enable and start containerd
  service:
    name: containerd
    state: started
    enabled: true
  become: true

- name: Ensure apt keyrings directory exists
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"
  become: true

- name: Add Kubernetes apt key
  get_url:
    url: "https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_version }}/deb/Release.key"
    dest: /etc/apt/keyrings/kubernetes-apt-keyring.asc
    mode: "0644"
  become: true

- name: Add Kubernetes apt repository
  apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.asc] https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_version }}/deb/ /"
    filename: kubernetes
    state: present
  become: true

- name: Install kubelet, kubeadm and kubectl
  apt:
    name:
      - kubelet
      - kubeadm
      - kubectl
    state: present
    update_cache: true
  become: true

- name: Hold kubernetes packages
  dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
    - kubelet
    - kubeadm
    - kubectl
  become: true

- name: Enable kubelet
  service:
    name: kubelet
    enabled: true
  become: true

- name: Allow intra-cluster traffic in UFW
  ufw:
    rule: allow
    src: "{{ subnet_kubernetes }}"
  become: true

- name: Allow Kubernetes API in UFW
  ufw:
    rule: allow
    port: "6443"
    proto: tcp
    src: "192.168.0.0/16"
  become: true
