[defaults]
inventory        = inventories/homelab/hosts.ini
roles_path       = roles
remote_user      = ansible
private_key_file = ~/.ssh/homelab
host_key_checking = False
vault_password_file = ~/.vault_pass

[ssh_connection]
ssh_args   = -o ProxyJump=ansible@BASTION_IP -o StrictHostKeyChecking=no -o ForwardAgent=yes
pipelining = True
