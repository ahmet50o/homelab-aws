[defaults]
inventory        = inventories/homelab/hosts.ini
roles_path       = roles
remote_user      = ansible
private_key_file = ~/.ssh/homelab
host_key_checking = False
vault_password_file = ~/.vault_pass

[ssh_connection]
ssh_args = -o ProxyCommand="ssh -W %h:%p -i ~/.ssh/homelab -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 ansible@BASTION_IP" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ControlMaster=auto -o ControlPersist=120s
pipelining = True
control_path = /tmp/ansible-cp-%%h-%%p-%%r
